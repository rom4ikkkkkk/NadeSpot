<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NadeSpot</title>
    <link rel="icon" href="img/icons/icon-192x192.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="/manifest.json">
  </head>

  <body>
    <header>
      <a class="logo">
        <img src="img\icons\nadespot.png" alt="NadeSpot Logo">
      </a>
    </header>

    <div class="container">
      <section id="active-maps" class="map-section">
        <div class="map-grid">
          <div class="map-card">
            <a href="anubis.html"
              ><img src="img/maps/anubis.jpg" alt="Anubis" />
              <h3>Anubis</h3></a>
          </div>
          <div class="map-card">
            <a href="mirage.html"
              ><img src="img/maps/mirage.jpg" alt="Mirage" />
              <h3>Mirage</h3></a>
          </div>
          <div class="map-card">
            <a href="ancient.html"
              ><img src="img/maps/ancient.jpg" alt="Ancient" />
              <h3>Ancient</h3></a>
          </div>
          <div class="map-card">
            <a href="dust2.html"
              ><img src="img/maps/dust2.jpg" alt="Dust II" />
              <h3>Dust II</h3></a>
          </div>
          <div class="map-card">
            <a href="inferno.html"
              ><img src="img/maps/inferno.jpg" alt="Inferno" />
              <h3>Inferno</h3></a>
          </div>
          <div class="map-card">
            <a href="nuke.html"
              ><img src="img/maps/nuke.jpeg" alt="Nuke" />
              <h3>Nuke</h3></a>
          </div>
          <div class="map-card">
            <a href="train.html"
              ><img src="img/maps/Train.png" alt="Train" />
              <h3>Train</h3></a>
          </div>
        </div>
      </section>

<footer class="bottom-header">
  <a href="index.html" class="icon">
    <img src="img/icons/mapicon.png" alt="Карта"/>
  </a>
  <button class="icon" onclick="toggleChat(true)">
    <img src="img/icons/goodtoknow.png" alt="Полезно"/>
  </button>
</footer>
<!-- Красивая кнопка внизу -->
<!-- Баннер установки -->
<div id="installOverlay"></div>
<div id="installBanner">
  <button id="closeBanner">×</button>
  <p>А ты знал, что у нас есть приложение?<br>Установи его и стань на шаг ближе к PRO-игроку!</p>
  <div class="custom-install-btn" id="installAppBtnBanner">
    <span>Установить</span>
  </div>
</div>

<!-- Красивая кнопка внизу -->
<div class="button-wrapper">
  <div class="custom-install-btn" id="installAppBtnFooter">
    <span>Установить приложение</span>
  </div>
</div>

<script src="myscript.js"></script>
  </body>
</html>
